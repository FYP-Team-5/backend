name: backend-service

services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-change-me}@backend-postgres:5432/${POSTGRES_DB:-user}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-bytes}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-assessment-services}
      ACCESS_TOKEN_EXPIRY_MINUTES: ${ACCESS_TOKEN_EXPIRY_MINUTES:-30}
      STAFF_REGISTRATION_KEY: ${STAFF_REGISTRATION_KEY:-development-staff-bootstrap-key}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      MAX_ANSWER_CHARACTERS: ${MAX_ANSWER_CHARACTERS:-50000}
      GRADING_POLL_SECONDS: ${GRADING_POLL_SECONDS:-1}
      GRADING_LEASE_SECONDS: ${GRADING_LEASE_SECONDS:-60}
      GRADING_MAX_RETRIES: ${GRADING_MAX_RETRIES:-3}
      GRADING_RETRY_SECONDS: ${GRADING_RETRY_SECONDS:-5}
      DATASET_S3_ENDPOINT: http://seaweedfs:8333
      DATASET_S3_BUCKET: ${DATASET_S3_BUCKET:-llm-training}
      DATASET_S3_ACCESS_KEY: ${DATASET_S3_ACCESS_KEY:-fyp-training}
      DATASET_S3_SECRET_KEY: ${DATASET_S3_SECRET_KEY:-development-only-training-secret}
      DATASET_S3_REGION: ${DATASET_S3_REGION:-us-east-1}
      DATASET_UPLOAD_MAX_BYTES: ${DATASET_UPLOAD_MAX_BYTES:-52428800}
      DATASET_POLL_SECONDS: ${DATASET_POLL_SECONDS:-5}
      DATASET_LEASE_SECONDS: ${DATASET_LEASE_SECONDS:-120}
      DATASET_MAX_RETRIES: ${DATASET_MAX_RETRIES:-3}
      DATASET_RETRY_SECONDS: ${DATASET_RETRY_SECONDS:-5}
    ports:
      - "${API_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${DATASET_S3_ACCESS_KEY:-fyp-training}
      AWS_SECRET_ACCESS_KEY: ${DATASET_S3_SECRET_KEY:-development-only-training-secret}
      S3_BUCKET: ${DATASET_S3_BUCKET:-llm-training}
    expose:
      - "8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9333/cluster/status >/dev/null && curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8333/ | grep -Eq '^(200|403)$'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  backend-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-user}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  seaweedfs_data: